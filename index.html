<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fafaf8" />
    <title>Codie Support</title>
    <style>
      :root { color-scheme: light; --bg:#fafaf8; --surface:#fff; --text:#1a1a1a; --muted:#6b6b6b; --line:#e8e6e1; --accent:#2f6f62; }
      * { box-sizing:border-box; }
      body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
      main { width:min(680px,calc(100% - 40px)); margin:0 auto; padding:72px 0; }
      .mark { display:grid; place-items:center; width:56px; height:56px; border:1px solid var(--line); border-radius:18px; background:var(--surface); }
      .mark svg { width:28px; }
      .eyebrow { margin:28px 0 8px; color:#9a5d40; font-size:12px; font-weight:800; letter-spacing:.14em; }
      h1 { margin:0; font-size:40px; letter-spacing:-.04em; }
      .lead { margin:14px 0 32px; color:var(--muted); font-size:17px; line-height:1.7; }
      .links { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
      a { color:inherit; text-decoration:none; }
      .card { min-height:132px; padding:22px; border:1px solid var(--line); border-radius:20px; background:var(--surface); transition:transform .15s ease,border-color .15s ease; }
      .card:hover { transform:translateY(-2px); border-color:#b9cfc7; }
      .card strong { display:block; font-size:17px; }
      .card span { display:block; margin-top:8px; color:var(--muted); font-size:14px; line-height:1.55; }
      footer { margin-top:48px; padding-top:20px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
      @media (max-width:560px) { main{padding:48px 0} h1{font-size:34px}.links{grid-template-columns:1fr} }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a3 3 0 1 0-3-3"/><path d="M16 8v3L5 25h22L16 11"/></svg>
      </div>
      <p class="eyebrow">CODIE SUPPORT</p>
      <h1>도움이 필요해?</h1>
      <p class="lead">개인정보 처리 기준을 확인하거나, Codie 사용 중 발견한 문제를 알려줘.</p>
      <div class="links">
        <a class="card" href="./privacy/"><strong>개인정보처리방침</strong><span>Codie가 어떤 정보를 왜 처리하고 어떻게 삭제하는지 확인해.</span></a>
        <a class="card" href="https://github.com/giwon1130/codie-support/issues"><strong>지원 요청</strong><span>문제 상황과 앱에 표시된 문의 코드를 남겨줘.</span></a>
      </div>
      <footer>Codie · Personal styling assistant</footer>
    </main>
  </body>
</html>
